name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run tsc

      - name: Test
        run: bun run test

  deploy:
    name: Migrate & Deploy
    needs: check
    # Deploy only via manual dispatch from main — never automatically on push or PR.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Drizzle Kit connects directly to Postgres (not through Hyperdrive), so
      # DATABASE_MIGRATIONS_URL must be the direct Neon URL with ?sslmode=require.
      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_MIGRATIONS_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}

      - name: Build and deploy
        run: bun run deploy
        env:
          # Public key only. The `/` page is prerendered, so its public runtime
          # config freezes at build time and a runtime value cannot reach it.
          NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # NUXT_CLERK_SECRET_KEY is deliberately absent. Nuxt keeps private
          # runtimeConfig out of the bundle, so a build-time value never reaches
          # the deployed worker; production reads the Cloudflare secret at
          # runtime instead. Keeping it out of the build also hides it from
          # every package that runs during `bun install`/`bun run build`.
          # Set it with: wrangler secret put NUXT_CLERK_SECRET_KEY
          # Used by `wrangler deploy` to authenticate to Cloudflare.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
