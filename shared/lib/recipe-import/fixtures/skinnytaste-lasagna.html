t-skim cottage cheese (from 1 1\/2 16-ounce containers, Good Culture (or use ricotta cheese))","2 large  eggs (beaten)","1 1\/2 cups part-skim shredded mozzarella cheese (divided)","1\/4 cup grated Pecorino Romano cheese","1\/4 cup chopped fresh parsley (plus more for for garnish)"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat oven to 375F degrees.","name":"Preheat oven to 375F degrees.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-0"},{"@type":"HowToStep","text":"Heat a large skillet, when hot add the ground beef, onion, and garlic and cook over medium-high heat, breaking the meat up with a wooden spoon until no pink remains.","name":"Heat a large skillet, when hot add the ground beef, onion, and garlic and cook over medium-high heat, breaking the meat up with a wooden spoon until no pink remains.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-1"},{"@type":"HowToStep","text":"Add the crushed tomatoes, season with salt and black pepper, to taste, cover and let it simmer over low heat 20 minutes, stirring 3 times.","name":"Add the crushed tomatoes, season with salt and black pepper, to taste, cover and let it simmer over low heat 20 minutes, stirring 3 times.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-2"},{"@type":"HowToStep","text":"In large mixing bowl, beat the eggs and combine with 1 1\/2 containers cottage cheese, 1\/2 cup of the mozzarella cheese, Pecorino Romano and parsley. Set aside.","name":"In large mixing bowl, beat the eggs and combine with 1 1\/2 containers cottage cheese, 1\/2 cup of the mozzarella cheese, Pecorino Romano and parsley. Set aside.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-3"},{"@type":"HowToStep","text":"In a 13 x 9 casserole dish, spread 1 cup of sauce on bottom of pan. Layer in the order, 4 uncooked lasagna noodles (it&#39;s okay if they overlap), then 1\/3 of the cheese mixture, 1 cup of the sauce.","name":"In a 13 x 9 casserole dish, spread 1 cup of sauce on bottom of pan. Layer in the order, 4 uncooked lasagna noodles (it&#39;s okay if they overlap), then 1\/3 of the cheese mixture, 1 cup of the sauce.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-4"},{"@type":"HowToStep","text":"Repeat the next layer using 4 uncooked lasagna noodles, 1\/3 part of the cheese mixture, and 1 cup sauce. For the top layer add the remaining sauce and finish with 1 cup mozzarella.","name":"Repeat the next layer using 4 uncooked lasagna noodles, 1\/3 part of the cheese mixture, and 1 cup sauce. For the top layer add the remaining sauce and finish with 1 cup mozzarella.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-5"},{"@type":"HowToStep","text":"Cover tight with foil and bake 55 to 60 minutes, until the pasta is cooked through.","name":"Cover tight with foil and bake 55 to 60 minutes, until the pasta is cooked through.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-6"},{"@type":"HowToStep","text":"Uncover and continue cooking until all the cheese browns slightly, about 5 minutes.","name":"Uncover and continue cooking until all the cheese browns slightly, about 5 minutes.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-7"},{"@type":"HowToStep","text":"Garnish with fresh parsley, and let sit 5 minutes before cutting. Slice into 8 pieces.","name":"Garnish with fresh parsley, and let sit 5 minutes before cutting. Slice into 8 pieces.","url":"https:\/\/www.skinnytaste.com\/lasagna-recipe\/#wprm-recipe-110160-step-0-8"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.77","ratingCount":"76","reviewCount":"13"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Loved it, but made some adjustments. Used 1.25 lbs of 96% lean beef, fat free mozzarella, less than 3\/4 of
